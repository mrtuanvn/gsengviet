<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VI-Translate Web</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        h1 { color: #2563eb; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; margin-top: 0.25rem; }
        button { background-color: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 1rem; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        #status { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; display: none; }
        .info { background-color: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; }
        .success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>VI-Translate</h1>
    <div class="container">
        <form id="translateForm">
            <div class="form-group">
                <label for="pdfFile">Chọn file PDF:</label>
                <input type="file" id="pdfFile" name="pdfFile" accept=".pdf" required>
            </div>
            <div class="form-group">
                <label for="langIn">Ngôn ngữ gốc (tùy chọn):</label>
                <input type="text" id="langIn" name="langIn" placeholder="Ví dụ: en">
            </div>
            <div class="form-group">
                <label for="langOut">Ngôn ngữ đích:</label>
                <input type="text" id="langOut" name="langOut" value="vi" required>
            </div>
            <button type="submit" id="submitBtn">Bắt đầu Dịch</button>
        </form>

        <div id="status">
            <span id="statusIcon"></span>
            <span id="statusText"></span>
        </div>
        
        <div id="downloadContainer" style="display: none; margin-top: 1rem;">
            <a id="downloadLink" href="#" style="display: block; text-align: center; background-color: #10b981; color: white; padding: 0.75rem; text-decoration: none; border-radius: 4px; font-weight: bold;">Tải PDF đã dịch</a>
        </div>
    </div>

    <script>
        document.getElementById('translateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('pdfFile');
            if (fileInput.files.length === 0) {
                alert('Vui lòng chọn một file PDF.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('lang_in', document.getElementById('langIn').value || 'en');
            formData.append('lang_out', document.getElementById('langOut').value || 'vi');

            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const downloadContainer = document.getElementById('downloadContainer');

            // Reset UI
            submitBtn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'info';
            statusIcon.className = 'loader';
            statusText.textContent = 'Đang xử lý PDF... Việc này có thể mất vài phút.';
            downloadContainer.style.display = 'none';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Có lỗi xảy ra khi dịch file.');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                statusDiv.className = 'success';
                statusIcon.className = '';
                statusText.textContent = 'Dịch thành công!';
                
                const downloadLink = document.getElementById('downloadLink');
                // suggest filename based on original
                const originalName = fileInput.files[0].name;
                const newName = originalName.replace('.pdf', '_translated.pdf');
                downloadLink.href = url;
                downloadLink.download = newName;
                downloadContainer.style.display = 'block';
                
            } catch (error) {
                statusDiv.className = 'error';
                statusIcon.className = '';
                statusText.textContent = 'Lỗi: ' + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
